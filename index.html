<style>
  :root{
    --pitch-dark:#071A33;
    --pitch:#0D3B73;
    --pitch-light:#1660A8;
    --chalk:#EEF4FA;
    --chalk-dim:#B8C7D8;
    --gold:#A9B8C9;
    --gold-bright:#DCE4EC;
    --red:#C8232C;
    --red-dim:#8E1D24;
    --green-profit:#3FBF7F;
    --ink:#06142A;
    --line: rgba(238,244,250,0.14);
    --line-strong: rgba(238,244,250,0.28);
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
  body{
    margin:0;
    font-family:'Barlow Semi Condensed',system-ui,sans-serif;
    color:var(--chalk);
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 40px, transparent 40px, transparent 80px),
      linear-gradient(180deg, var(--pitch-dark), var(--pitch) 60%, var(--pitch-dark));
    min-height:100vh;
  }
  .app{max-width:960px; margin:0 auto; padding:18px 16px 60px;}

  .scoreboard{
    background: linear-gradient(180deg, #05132A, #071A33);
    border:1px solid var(--line-strong);
    border-radius:var(--radius);
    padding:18px 20px 0;
    box-shadow:var(--shadow);
    position:sticky; top:10px; z-index:20;
  }
  .scoreboard-top{display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px;}
  h1{
    font-family:'Barlow Semi Condensed', system-ui, sans-serif;
    letter-spacing:0.5px;
    font-weight:700;
    font-size:clamp(26px,6vw,38px);
    line-height:1.05;
    margin:0;
    color:var(--gold-bright);
    text-shadow:0 2px 0 rgba(0,0,0,0.3);
  }
  .subtitle{font-size:15px; font-weight:600; letter-spacing:0.3px; margin-top:2px; color:var(--chalk-dim); font-family:'Barlow Semi Condensed',system-ui,sans-serif;}
  .stat-strip{display:flex; gap:16px; margin:12px 0 0; flex-wrap:wrap;}
  .stat{font-family:'Barlow Semi Condensed',system-ui,sans-serif; font-size:14px; color:var(--chalk-dim); display:flex; align-items:baseline; gap:6px;}
  .stat b{font-family:'Barlow Semi Condensed',system-ui,sans-serif; font-size:20px; color:var(--gold-bright); letter-spacing:0.5px;}
  .stat.profit-pos b{color:var(--green-profit);}
  .stat.profit-neg b{color:#f0998a;}
  .tabs{display:flex; gap:2px; margin-top:14px; overflow-x:auto;}
  .subtabs-sticky{
    position:sticky; z-index:15; overflow-x:auto;
    background:linear-gradient(180deg, var(--pitch-dark), var(--pitch-dark) 85%, transparent);
    margin:0 -16px 14px; padding:10px 16px 6px;
  }
  .subtabs-sticky .tabs{margin-top:0;}
  .tab-btn{
    font-family:'Barlow Semi Condensed',system-ui,sans-serif;
    letter-spacing:1px;
    font-size:14px;
    background:transparent;
    color:var(--chalk-dim);
    border:none;
    border-bottom:3px solid transparent;
    padding:10px 12px 12px;
    cursor:pointer;
    white-space:nowrap;
  }
  .tab-btn.active{color:var(--gold-bright); border-bottom-color:var(--gold);}
  .tab-btn:hover{color:var(--chalk);}

  main{margin-top:18px;}
  .tab-panel{display:none;}
  .tab-panel.active{display:block; animation:fadein .18s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

  .card{
    background:rgba(7,26,51,0.55);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .card h2{
    font-family:'Barlow Semi Condensed',system-ui,sans-serif;
    font-size:20px; letter-spacing:1px;
    margin:0 0 12px;
    color:var(--gold-bright);
  }
  label{font-size:14px; color:var(--chalk-dim); display:block; margin-bottom:4px; font-family:'Barlow Semi Condensed',system-ui,sans-serif;}
  input[type=text], input[type=number], input[type=date], select, textarea{
    width:100%;
    background:rgba(0,0,0,0.25);
    border:1px solid var(--line-strong);
    color:var(--chalk);
    border-radius:6px;
    padding:9px 10px;
    font-size:14px;
    font-family:'Barlow Semi Condensed',system-ui,sans-serif;
  }
  input:focus, select:focus, textarea:focus, button:focus-visible{
    outline:2px solid var(--gold-bright); outline-offset:1px;
  }
  .row{display:flex; gap:10px; flex-wrap:wrap;}
  .row > div{flex:1; min-width:140px;}
  .field{margin-bottom:10px;}

  .btn{
    font-family:'Barlow Semi Condensed',system-ui,sans-serif;
    letter-spacing:0.5px;
    font-size:15px;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    color:#1a1305;
    border:none;
    border-radius:6px;
    padding:9px 18px;
    cursor:pointer;
  }
  .btn:hover{filter:brightness(1.06);}
  .btn.secondary{
    background:transparent;
    border:1px solid var(--line-strong);
    color:var(--chalk);
  }
  .btn.danger{
    background:transparent;
    border:1px solid var(--red);
    color:#e8b3a9;
  }
  .btn.small{padding:5px 10px; font-size:15px;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}

  .toggle-group{display:flex; gap:8px;}
  .toggle-opt{
    flex:1;
    text-align:center;
    padding:10px 10px;
    border:1px solid var(--line-strong);
    border-radius:6px;
    cursor:pointer;
    font-family:'Barlow Semi Condensed',system-ui,sans-serif;
    letter-spacing:0.5px;
    font-size:15px;
    color:var(--chalk-dim);
  }
  .toggle-opt.active-add{background:rgba(22,96,168,0.5); color:var(--chalk); border-color:var(--pitch-light);}
  .toggle-opt.active-sold{background:rgba(200,35,44,0.5); color:var(--chalk); border-color:var(--red);}

  .cat-pills{display:flex; gap:8px; flex-wrap:wrap;}
  .cat-pill{
    padding:8px 12px;
    border-radius:20px;
    border:1px solid var(--line-strong);
    cursor:pointer;
    font-size:15px;
    color:var(--chalk-dim);
  }
  .cat-pill.active{background:var(--gold); color:#1a1305; border-color:var(--gold); font-weight:600;}

  .toast{
    font-size:15px; color:#c9e8d4; background:rgba(22,96,168,0.35);
    border:1px solid var(--pitch-light); border-radius:6px; padding:8px 12px; margin-top:10px;
  }
  .toast.toast-warn{
    color:#3a2a08; background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    border:1px solid #8a6a1f; font-weight:600;
  }
  .dup-sold-tag{
    display:inline-block;
    font-family:'Barlow Semi Condensed',system-ui,sans-serif; font-size:13px; font-weight:600;
    color:#3a2a08; background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    border-radius:4px; padding:2px 8px;
  }

  .batch-item{
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px 14px;
    margin-bottom:10px;
    background:rgba(0,0,0,0.15);
  }
  .batch-head{display:flex; flex-direction:column; gap:6px; cursor:pointer;}
  .batch-head-top{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
  .batch-head-actions{display:flex; gap:8px; flex-wrap:wrap; flex-shrink:0;}
  .batch-name{font-weight:600; font-size:15px;}
  .batch-meta{font-family:'Barlow Semi Condensed',system-ui,sans-serif; font-size:14px; color:var(--chalk-dim);}
  .batch-num{
    font-family:'Barlow Semi Condensed',system-ui,sans-serif;
    color:var(--gold-bright);
    border:1px solid var(--gold);
    border-radius:50%;
    width:26px; height:26px;
    display:inline-flex; align-items:center; justify-content:center;
    font-size:15px; margin-right:8px;

  .entry-list{margin-top:10px; border-top:1px dashed var(--line); padding-top:10px; display:none;}

  .entry-row{display:flex; justify-content:space-between; align-items:center; padding:5px 0; font-size:15px; border-bottom:1px solid var(--line);}
  .entry-row:last-child{border-bottom:none;}
  .entry-left{display:flex; gap:8px; align-items:center;}
  .tag{font-family:'Barlow Semi Condensed',system-ui,sans-serif; font-size:13px; padding:2px 6px; border-radius:4px;}
  .tag.add{background:rgba(22,96,168,0.4); color:#bfe8d2;}
  .tag.sold{background:rgba(200,35,44,0.4); color:#f0c2b9;}

    font-weight:600; font-size:15px;

    background:rgba(0,0,0,0.2);

  }
  .count-badge{
    position:absolute; top:-6px; right:-6px;
    background:var(--gold); color:#1a1305;
    border-radius:50%; width:19px; height:19px;
    font-size:12px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    font-family:'Barlow Semi Condensed',system-ui,sans-serif;
    border:1px solid var(--pitch-dark);

    text-align:center; padding:30px 10px; color:var(--chalk-dim); font-size:14px;

  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .dot{width:12px; height:12px; border-radius:50%; display:inline-block;}

  .dot.sold{background:rgba(142,29,36,0.5); border:2px solid var(--red);}

  .badge{cursor:pointer;}
  .badge.vinted-listed{box-shadow:0 0 0 2px #09B1BA inset;}
  .vinted-badge{
    position:absolute; bottom:-6px; left:-6px;

    border-radius:50%; width:19px; height:19px;
    font-size:12px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    font-family:'Barlow Semi Condensed',system-ui,sans-serif;

  .needed-item.fulfilled .needed-badge{border:2px solid var(--gold); color:var(--gold-bright);}
  .needed-note{font-size:14px; color:var(--chalk-dim);}
  .fulfilled-tag{font-size:13px; font-family:'Barlow Semi Condensed',system-ui,sans-serif; color:var(--gold-bright); background:rgba(201,210,220,0.2); padding:2px 6px; border-radius:4px;}

  .profit-box{
    flex:1; min-width:140px;

    border-radius:8px;

  .profit-box.spent .val{color:#f0998a;}

  .ledger-row{display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); font-size:15px; flex-wrap:wrap; gap:6px;}
  .ledger-row:last-child{border-bottom:none;}
  .ledger-left{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}

  .footer-actions{text-align:right; margin-top:20px;}
  .loading{text-align:center; padding:40px; color:var(--chalk-dim); font-family:'Barlow Semi Condensed',system-ui,sans-serif;}
  .hint{font-size:14px; color:var(--chalk-dim); margin-top:8px;}
</style>

function fmtNums(arr){
  const out=[]; let i=0;
  while(i<arr.length){
    if(!/^\d+$/.test(arr[i])){ out.push(arr[i]); i++; continue; }
    let j=i; while(j+1<arr.length && /^\d+$/.test(arr[j+1]) && +arr[j+1]===+arr[j]+1) j++;
    out.push(j>i+1 ? arr[i]+'-'+arr[j] : arr.slice(i,j+1).join(', ')); i=j+1;
  }
  return out.join(', ');
}

// Trimite in Supabase, cu un mic indicator "se sincronizeaza.../sincronizat/esuat" langa Salveaza.
// IMPORTANT: nu mai pune alt debounce aici — saveData() deja a asteptat 150ms; daca mai asteptam
// si aici, utilizatorul putea inchide pagina inainte sa apuce sa plece vreo cerere spre Supabase.
let pendingSyncCount = 0;
let syncChain = Promise.resolve(); // coada: fiecare sincronizare asteapta sa se termine cea de dinainte, niciodata in paralel
async function syncToSupabase(){
  if(!currentUserId) return;
  pendingSyncCount++;
  flashSaveStatus('☁️ Se sincronizează...', false, true);
  const run = syncChain.then(async () => {
    await pushToSupabase(); // foloseste starea CEA MAI RECENTA, oricat a durat coada pana aici
  });
  syncChain = run.catch(() => {}); // o eroare nu trebuie sa blocheze coada pentru sincronizarile urmatoare
  try{
    await run;
    flashSaveStatus('☁️ Sincronizat');
  }catch(e){
    console.error('Sincronizare eșuată', e);
    flashSaveStatus('⚠️ Sincronizare eșuată — ' + (e && e.message ? e.message : 'verifică conexiunea') + '. Am păstrat totul local, încearcă din nou Salvează.', true, true);
  }finally{
    pendingSyncCount = Math.max(0, pendingSyncCount - 1);
  }
}
window.addEventListener('beforeunload', (e) => {
  if(pendingSyncCount > 0){
    e.preventDefault();
    e.returnValue = 'Se mai sincronizează date cu Supabase — dacă închizi acum, riști să pierzi ultimele modificări.';
    return e.returnValue;
  }
});

function flashSaveStatus(msg, isErr, persist){
  const s = document.getElementById('save-status');
  if(!s) return;
  s.textContent = msg;
  s.style.color = isErr ? '#f0998a' : 'var(--green-profit)';
  if(persist) return; // "se sincronizeaza..." si erorile raman pe ecran pana apare urmatorul mesaj
  setTimeout(() => { const el2 = document.getElementById('save-status'); if(el2 && el2.textContent === msg) el2.textContent = ''; }, isErr ? 6000 : 1800);
}

function parseNumbers(str){
  return str.split(',').flatMap(part => {
    part = part.trim().toUpperCase();
    if(!part) return [];
    if(/^\d+\s*-\s*\d+$/.test(part)){
      const [a,b] = part.split('-').map(s => parseInt(s.trim(),10));
      if(!isNaN(a) && !isNaN(b) && b >= a && (b-a) < 500){
        const arr = [];
        for(let i=a;i<=b;i++) arr.push(String(i));
        return arr;
      }
    }
    return [part];
  });
}

// status per category+number = last action chronologically (kept for reference/back-compat)
function statusOf(category, number){
  const matches = state.entries.filter(e => e.category === category && e.number === number);
  if(matches.length === 0) return null;
  matches.sort((a,b) => a.ts - b.ts);
  return matches[matches.length-1].action;
}

// Physical stock still owned for a category+number, oldest-purchased-first (FIFO).
// Each item in the returned array is the original 'added' entry (carries batchId).
function stockFor(category, number){
  const adds = state.entries.filter(e => e.category === category && e.number === number && e.action === 'added').sort((a,b) => {
    // FIFO pe data pachetului (cum a fost completată de utilizator), nu pe momentul în care a fost tastat numărul.
    // La aceeași dată (sau pachet șters), momentul introducerii decide.
    const ba = batchById(a.batchId), bb = batchById(b.batchId);
    const da = (ba && ba.date) || '', db = (bb && bb.date) || '';
    if(da !== db) return da.localeCompare(db);
    return a.ts - b.ts;
  });
  const soldCount = state.entries.filter(e => e.category === category && e.number === number && e.action === 'sold').length;
  return adds.slice(soldCount);
}
function stockCount(category, number){
  return stockFor(category, number).length;
}
// Total physical units currently owned for a number, summed across all 3 categories.
function globalStockCount(number){
  return CATEGORIES.reduce((sum, cat) => sum + stockCount(cat, number), 0);
}

// Checks which about-to-be-sold numbers were marked "Listat pe Vinted", warns about them, and
// automatically unlists them (since they're being sold offline right now).
function checkAndUnlistVinted(itemsByCategory){
  const warnings = [];
  Object.keys(itemsByCategory).forEach(cat => {
    const seen = new Set();
    (itemsByCategory[cat] || []).forEach(n => {
      if(seen.has(n)) return;
      seen.add(n);
      if(isVintedListed(cat, n)){
        warnings.push({ cat, n });
        unlistVinted(cat, n);
      }
    });
  });
  return warnings;
}
// Grupeaza numerele scoase de pe Vinted pe sectiuni fixe: Steme, Élite, Enjoy, Zona VIP, Master Rookie,
// Stars On 25, Bază (jucători) — doar daca exista ceva acolo —, Power, Rare.
function groupVintedWarnings(warnings){
  const order = ['Steme','Élite','Enjoy','Zona VIP','Master Rookie','Stars On 25','Bază (jucători)','Power','Rare'];
  const byLabel = {};
  warnings.forEach(({ cat, n }) => {
    let label;
    if(cat === 'Baza'){
      const item = CATALOG.Baza.find(i => i.n === n);
      label = (item && item.isStema) ? 'Steme' : 'Bază (jucători)';
    } else if(cat === 'Speciale'){
      const item = CATALOG.Speciale.find(i => i.n === n);
      label = (item && item.g) || 'Speciale';
    } else {
      label = CAT_LABEL[cat] || cat; // Power, Rare — un singur bucket, nelucrat pe sub-serii aici
    }
    (byLabel[label] = byLabel[label] || []).push(n);
  });
  return order.filter(l => byLabel[l] && byLabel[l].length).map(l => [l, byLabel[l]]);
}

function allNumbersForCategory(category){
  const set = new Set();
  state.entries.filter(e => e.category === category).forEach(e => set.add(e.number));
  return Array.from(set).sort((a,b) => {
    const na = parseInt(a,10), nb = parseInt(b,10);
    if(!isNaN(na) && !isNaN(nb)) return na - nb;
    return a.localeCompare(b);
  });
}

function counts(){
  let owned = 0;
  CATEGORIES.forEach(cat => {
    allNumbersForCategory(cat).forEach(n => { owned += stockCount(cat, n); });
  });
  const sold = state.entries.filter(e => e.action === 'sold').length;
  const totalSpent = state.batches.reduce((sum,b) => sum + (typeof b.price === 'number' ? b.price : 0), 0);
  const totalEarned = state.sales.reduce((sum,s) => sum + (typeof s.price === 'number' ? s.price : 0), 0);
  return {owned, sold, needed: CATEGORIES.reduce((sum,cat) => sum + missingList(cat).length, 0), batches: state.batches.length, totalSpent, totalEarned, profit: totalEarned - totalSpent};
}

function createBatch(name, date, price){

function addEntries(batchId, category, numbersStr, action){
  const nums = parseNumbers(numbersStr);
  return addEntriesArray(batchId, category, nums, action);
}
function addEntriesArray(batchId, category, nums, action){
  if(!nums || nums.length === 0) return [];
  const ts = Date.now();
  nums.forEach((n, i) => {
    state.entries.push({ id: genId(), batchId, category, number: n, action, ts: ts + i });
  });
  saveData();
  return nums;
}
// itemsByCategory: { Heroes_Contenders: ['16','20'], Power_Up: ['3'] }
// Attributes each sold unit to the batch it FIFO-came from, and records that lineage on the sale
// so per-batch profit stays correct even if more purchases/sales happen later.
function addSale(date, price, itemsByCategory){
  const units = [];
  const consumedSoFar = {}; // "category|number" -> how many units of it we've already allocated in this sale
  Object.keys(itemsByCategory).forEach(cat => {
    (itemsByCategory[cat] || []).forEach(n => {
      const key = cat + '|' + n;
      const already = consumedSoFar[key] || 0;
      const remainingStock = stockFor(cat, n); // FIFO, oldest remaining first, computed BEFORE this sale's entries are pushed
      const unit = remainingStock[already];
      consumedSoFar[key] = already + 1;
      // wasDuplicate reflects stock BEFORE this whole sale (not decremented mid-loop) — true if you had 2+ of this number.
      units.push({ category: cat, number: n, batchId: unit ? unit.batchId : null, wasDuplicate: remainingStock.length > 1, hadTriple: remainingStock.length >= 3 });
    });
  });
  if(units.length === 0) return null;
  const saleId = genId();
  const ts = Date.now();
  units.forEach((u, i) => {
    // saleId links this entry back to the sale, so deleting/editing the sale can find & reverse it correctly
    state.entries.push({ id: genId(), batchId: null, category: u.category, number: u.number, action: 'sold', ts: ts + i, saleId });
  });
  const sale = { id: saleId, num: state.sales.length + 1, ts, date: date || todayStr(), price: (price === '' || price === null || isNaN(price)) ? null : Number(price), units };
  state.sales.push(sale);
  saveData();
  return sale;
}
// Groups a sale's units by source batch, for display ("din ce plic a venit fiecare cartonaș vândut")
function groupSaleUnitsByBatch(sale){
  const map = {};
  sale.units.forEach(u => {
    const key = u.batchId || '__unknown__';
    map[key] = map[key] || [];
    map[key].push(u.number);
  });
  return Object.keys(map).map(key => ({
    batchId: key === '__unknown__' ? null : key,
    batchName: key === '__unknown__' ? 'sursă necunoscută' : (batchById(key) ? batchById(key).name : 'pachet șters'),
    numbers: map[key]
  }));
}

function deleteEntry(id){
  const entry = state.entries.find(e => e.id === id);
  if(entry && entry.action === 'added'){
    const stillInStock = stockFor(entry.category, entry.number).some(u => u.id === id);
    if(!stillInStock){
      alert('Acest cartonaș a fost deja vândut — nu-l poți șterge direct de aici fără să strici evidența stocului. Șterge sau editează vânzarea lui din tab-ul Profit, în schimb.');
      return;
    }
  }
  state.entries = state.entries.filter(e => e.id !== id);
  saveData();
  render();
}
function deleteBatch(id){
  if(!confirm('Ștergi acest pachet și toate intrările lui? Nu se poate anula.')) return;
  state.batches = state.batches.filter(b => b.id !== id);
  state.entries = state.entries.filter(e => e.batchId !== id);

}
function editBatch(id, name, date, price){
  const b = batchById(id);
  if(!b) return;
  b.name = (name || '').trim() || b.name;
  b.date = date || b.date;
  b.price = (price === '' || price === null || isNaN(price)) ? null : Number(price);
  saveData();
}
// Finds the sold-entries that belong to a given sale, handling both new sales (tagged with saleId)
// and legacy sales made before that tagging existed (best-effort match by category+number).
function findSaleEntries(sale){
  const linked = state.entries.filter(e => e.saleId === sale.id);
  if(linked.length > 0) return linked;
  const found = [];
  (sale.units || []).forEach(u => {
    const candidate = state.entries.find(e =>
      e.category === u.category && e.number === u.number && e.action === 'sold' &&
      !e.saleId && !found.includes(e)
    );
    if(candidate) found.push(candidate);
  });
  return found;
}
function deleteSale(id){
  if(!confirm('Ștergi această vânzare? Cartonașele vândute revin automat în stoc (ca și cum n-ai fi vândut).')) return;
  const sale = state.sales.find(s => s.id === id);
  if(sale){
    const toRemoveIds = new Set(findSaleEntries(sale).map(e => e.id));
    state.entries = state.entries.filter(e => !toRemoveIds.has(e.id));
  }
  state.sales = state.sales.filter(s => s.id !== id);
  saveData();
  render();
}
// Pulls a sale back out for editing: puts its cards back in stock (like a delete), but keeps a
// durable backup (saved to storage, survives a page reload) so "Renunță" can restore it exactly.
function beginEditSale(id){
  const sale = state.sales.find(s => s.id === id);
  if(!sale) return;
  const linkedEntries = findSaleEntries(sale);
  const removeIds = new Set(linkedEntries.map(e => e.id));

    entries: JSON.parse(JSON.stringify(linkedEntries))
  };
  state.entries = state.entries.filter(e => !removeIds.has(e.id));
  state.sales = state.sales.filter(s => s.id !== id);
  saveData();

  formMode = 'sold';
  activeTab = 'pachete';
  render();

function handleImportFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    let parsed;
    try{
      parsed = JSON.parse(e.target.result);
    }catch(err){
      alert('Fișierul nu a putut fi citit ca JSON valid.');
      return;
    }
    if(!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.batches) || !Array.isArray(parsed.entries)){
      alert('Fișierul nu pare un backup valid al trackerului Mega Cracks.');
      return;
    }
    if(!confirm('Acest import înlocuiește COMPLET datele curente din album cu cele din fișier. Nu se poate anula. Continui?')) return;
    state = Object.assign({ batches: [], entries: [], needed: [], sales: [], pendingEditDraft: null, vintedListed: [] }, parsed);
    saleResolution = null;
    calcResolution = null;
    calcResult = null;
    editingBatchId = null;
    expandedBatch = null;
    newBatchMode = false;
    saveData();
    render();
    flashSaveStatus('✓ Importat', false);
  };
  reader.onerror = () => alert('Nu am putut citi fișierul selectat.');
  reader.readAsText(file);
}

// Guess which category a sold number belongs to, based on what's currently owned.
// Returns { autoItems: {cat:[nums]}, ambiguous: [{number, options}] }
function resolveSaleCategories(numbersStr){
  const nums = parseNumbers(numbersStr);
  const autoItems = {};
  const ambiguous = [];
  nums.forEach(n => {
    const candidates = CATEGORIES.filter(cat => stockCount(cat, n) > 0);
    if(candidates.length === 1){
      autoItems[candidates[0]] = autoItems[candidates[0]] || [];
      autoItems[candidates[0]].push(n);
    } else {
      ambiguous.push({ number: n, options: candidates.length > 1 ? candidates : CATEGORIES.slice(), notFound: candidates.length === 0 });
    }
  });
  return { autoItems, ambiguous };
}

// Turns { cat: [numbers...] } into a priced quote, applying the bulk discount when total count is high enough.
// Grupeaza numerele vandute dupa sub-seria din catalog (Zona VIP, Enjoy, Master Rookie...).
// Pentru Baza (grupat pe echipe) nu despartim, ar fi 20 de linii fara rost intr-o oferta.
function groupNumsByCatalogGroup(cat, nums){
  if(!nums.length) return [];
  if(cat === 'Baza') return [[null, nums]];
  const order = [], byGroup = {};
  nums.forEach(n => {
    const item = CATALOG[cat].find(i => i.n === n);
    const g = item ? item.g : 'Altele';
    if(!byGroup[g]){ byGroup[g] = []; order.push(g); }
    byGroup[g].push(n);
  });
  return order.map(g => [g, byGroup[g]]);
}
// Construieste textul simplu, de copiat si trimis cumparatorului.
// Sorteaza crescator dupa partea numerica (19 inainte de 199; SOB2 inainte de SOB10), cu textul complet ca egalizator.
function sortNumsAsc(nums){
  return nums.slice().sort((a, b) => {
    const na = parseInt((String(a).match(/\d+/) || ['0'])[0], 10);
    const nb = parseInt((String(b).match(/\d+/) || ['0'])[0], 10);
    return na - nb || String(a).localeCompare(String(b));
  });
}
function buildQuoteText(){
  if(!calcResult) return '';
  const lines = [];
  calcResult.breakdown.forEach(b => {
    const groups = b.forcedGroup ? [[b.forcedGroup, b.dupNums]] : groupNumsByCatalogGroup(b.cat, b.dupNums);
    groups.forEach(([g, nums0]) => {
      const nums = sortNumsAsc(nums0);
      const label = (b.cat === 'Baza' && !b.forcedGroup) ? 'Bază (jucători)' : (g ? `${CAT_LABEL[b.displayCat]} - ${g}` : CAT_LABEL[b.displayCat]);
      lines.push(`${label}: ${nums.join(', ')}`);
      lines.push(`${nums.length} buc × ${fmtLei(b.unitPrice)} = ${fmtLei(nums.length * b.unitPrice)}`);
      lines.push('');
    });
  });
  lines.push(`Subtotal: ${fmtLei(calcResult.totalBeforeDiscount)}`);
  if(calcResult.discountApplies) lines.push(`Reducere ${calcDiscountPercent}% (peste ${calcDiscountThreshold} cartonașe): −${fmtLei(calcResult.discountAmount)}`);
  lines.push(`TOTAL: ${fmtLei(calcResult.finalTotal)}`);
  return lines.join('\n');
}
function computeQuote(itemsByCategory){
  let totalCount = 0;
  // La Bază, stemele (sigla echipei) se pretuiesc si se afiseaza ca Speciale — desi numarul e tehnic la Bază,
  // iar stockCount tot trebuie interogat pe categoria reala ('Baza'), altfel nu gaseste cartonasul in colectie.
  const buildEntry = (realCat, numbers, unitPrice, displayCat, forcedGroup) => {
    const dupNums = [], albumOnlyNums = [], missingNums = [];
    numbers.forEach(n => {
      const cnt = stockCount(realCat, n);
      if(cnt > 1) dupNums.push(n);
      else if(cnt === 1) albumOnlyNums.push(n);
      else missingNums.push(n);
    });
    const pricedCount = dupNums.length; // albumOnlyNums si missingNums nu se preteaza aici
    totalCount += pricedCount;
    return { cat: realCat, displayCat: displayCat || realCat, forcedGroup, numbers, count: pricedCount, unitPrice, subtotal: pricedCount * unitPrice, dupNums, albumOnlyNums, missingNums };
  };
  const breakdown = [];
  CATEGORIES.forEach(cat => {
    const numbers = itemsByCategory[cat] || [];
    if(cat === 'Baza'){
      const stemaNums = [], plainNums = [];
      numbers.forEach(n => {
        const item = CATALOG.Baza.find(i => i.n === n);
        (item && item.isStema ? stemaNums : plainNums).push(n);
      });
      breakdown.push(buildEntry('Baza', plainNums, calcPrices.Baza));
      if(stemaNums.length) breakdown.push(buildEntry('Baza', stemaNums, calcPrices.Speciale, 'Speciale', 'Stemă'));
    } else {
      breakdown.push(buildEntry(cat, numbers, calcPrices[cat] || 0));
    }
  });
  const filtered = breakdown.filter(b => b.count > 0 || b.missingNums.length > 0 || b.albumOnlyNums.length > 0);
  breakdown.length = 0; breakdown.push(...filtered);
  const totalBeforeDiscount = breakdown.reduce((sum, b) => sum + b.subtotal, 0);
  const discountApplies = totalCount > calcDiscountThreshold;
  const discountAmount = discountApplies ? totalBeforeDiscount * (calcDiscountPercent / 100) : 0;
  const finalTotal = totalBeforeDiscount - discountAmount;
  return { breakdown, totalCount, totalBeforeDiscount, discountApplies, discountAmount, finalTotal };
}

// Builds "you already have this X times" warnings, computed BEFORE the sale is recorded
// (since stock counts change once addSale runs).
function buildDuplicateNotes(itemsByCategory){
  // dupNums: aveai exact 2 exemplare (dublura obisnuita). tripleNums: aveai 3 sau mai multe (cutia de tripluri).
  const dupNums = [], tripleNums = [];
  Object.keys(itemsByCategory).forEach(cat => {
    const seen = new Set();
    (itemsByCategory[cat] || []).forEach(n => {
      if(seen.has(n)) return;
      seen.add(n);
      const cnt = stockCount(cat, n);
      if(cnt === 2) dupNums.push(n);
      else if(cnt >= 3) tripleNums.push(n);
    });
  });
  return { dupNums, tripleNums };
}
// Shows the normal sale confirmation, plus a separate, visually distinct warning if a duplicate/triplicate was sold.
function showSaleToast(msg, dupNums, tripleNums, vintedWarnings){
  const area = document.getElementById('toast-area');
  if(!area) return;
  let html = `<div class="toast">${escapeHtml(msg)}</div>`;
  const hasDup = dupNums && dupNums.length, hasTriple = tripleNums && tripleNums.length;
  if(hasDup || hasTriple){
    const sortNums = arr => [...arr].sort((a, b) => String(a).localeCompare(String(b), undefined, {numeric: true}));
    const fmt = arr => escapeHtml(sortNums(arr).map(n => '#' + n).join(', '));
    const lines = [];
    if(hasDup) lines.push(`Dubluri (binder): ${fmt(dupNums)}`);
    if(hasTriple) lines.push(`Tripluri (cutie): ${fmt(tripleNums)}`);
    html += `<div class="toast ${hasTriple ? 'toast-triple' : 'toast-warn'}">📦 Vândute:<br>${lines.join('<br>')}</div>`;
  }
  if(vintedWarnings && vintedWarnings.length){
    const groups = groupVintedWarnings(vintedWarnings);
    const lines = groups.map(([label, nums]) => `- ${escapeHtml(label)}: ${escapeHtml(nums.map(n => '#' + n).join(', '))}`).join('<br>');
    html += `<div class="toast toast-warn">🛒 Erau listate pe Vinted — scoate-le de acolo:<br>${lines}</div>`;
  }
  area.innerHTML = html;
}

// Records the sale and shows one confirmation with: what was sold, which batch it came from, and duplicate warnings.
function finalizeSale(date, price, itemsByCategory){
  const { dupNums, tripleNums } = buildDuplicateNotes(itemsByCategory);
  const vintedWarnings = checkAndUnlistVinted(itemsByCategory);
  const wasEditing = !!state.pendingEditDraft;
  const sale = addSale(date, price, itemsByCategory);
  if(!sale) return null;
  if(wasEditing){ state.pendingEditDraft = null; saveData(); }
  render();
  activeTab = 'pachete';
  const catBreakdown = Object.entries(groupSaleUnitsByCategory(sale)).map(([cat,nums]) => `${CAT_LABEL[cat]}: ${nums.join(', ')}`).join(' · ');
  const batchBreakdown = groupSaleUnitsByBatch(sale).map(g => `${g.batchName}: ${g.numbers.join(', ')}`).join(' · ');
  const msg = (wasEditing ? 'Vânzare actualizată: ' : 'Vândut: ') + `${catBreakdown} — ${fmtLei(sale.price)}. Scăzut din: ${batchBreakdown}.`;
  setTimeout(() => showSaleToast(msg, dupNums, tripleNums, vintedWarnings), 0);
  return sale;
}

      const allAddedNums = [];
      const newForAlbum = [], dupNums = [], unknownNums = [], createdEntryIds = [];
      const runningStock = {}; // "categorie|numar" -> cate exemplare avea deja, simuland in ordine ce scrii in aceeasi achizitie
      const toAdd = { Baza: [], Speciale: [], Power: [], Rare: [] };
      const notPlaced = [];
      const bs = document.getElementById('numbers-BazaSpeciale');
      if(bs && bs.value.trim()){
        parseNumbers(bs.value).forEach(n => {
          if(CATALOG.Baza.some(i => i.n === n)) toAdd.Baza.push(n);
          else if(CATALOG.Speciale.some(i => i.n === n)) toAdd.Speciale.push(n);
          else notPlaced.push(n);
        });
      }
      ['Power','Rare'].forEach(cat => {
        const inp = document.getElementById(`numbers-${cat}`);
        if(inp && inp.value.trim()) toAdd[cat].push(...parseNumbers(inp.value));
      });
      CATEGORIES.forEach(cat => {
        const nums0 = toAdd[cat];
        if(!nums0.length) return;
        nums0.forEach(n => {
          const ci = CATALOG[cat].find(i => i.n === n);
          if(!ci || ci.na){ unknownNums.push(`${n} (${CAT_LABEL[cat]})`); return; }
          const key = cat + '|' + n;
          if(!(key in runningStock)) runningStock[key] = stockCount(cat, n);
          if(runningStock[key] === 0){ if(!newForAlbum.includes(n)) newForAlbum.push(n); }
          else { dupNums.push(n); }
          runningStock[key]++;
        });
        const beforeLen = state.entries.length;
        const nums = addEntriesArray(batchId, cat, nums0, 'added');
        if(nums.length){
          totalAdded += nums.length; breakdown.push(`${CAT_LABEL[cat]}: ${nums.join(', ')}`); allAddedNums.push(...nums);
          createdEntryIds.push(...state.entries.slice(beforeLen).map(e => e.id));
        }
      });
      if(totalAdded === 0){
        showToast(notPlaced.length
          ? `N-am găsit în Bază/Speciale: ${notPlaced.join(', ')}. Dacă sunt Power sau Rare, pune-le în căsuța lor.`
          : 'Introdu cel puțin un număr, în oricare categorie.', true);
        return;
      }
      expandedBatch = batchId;
      render();
      activeTab = 'pachete';
      let msg = `Adăugat: ${breakdown.join(', ')}.`;
      if(newForAlbum.length) msg += `\n🎯 Noi în album: ${newForAlbum.join(', ')}!`;
      if(dupNums.length) msg += `\n🔁 Dubluri: ${dupNums.join(', ')}.`;
      if(unknownNums.length) msg += ` ⚠️ Nu există în lista Megacracks (verifică): ${unknownNums.join(', ')}.`;
      if(notPlaced.length) msg += ` ⚠️ Nu le-am adăugat, nu sunt în Bază/Speciale: ${notPlaced.join(', ')}.`;
      setTimeout(() => showToast(msg, false, createdEntryIds), 0);
    } else {
      const numbersStr = document.getElementById('numbers-input').value;
      if(!numbersStr.trim()){
        showToast('Introdu cel puțin un număr de cartonaș.', true);
        return;
      }
      const date = document.getElementById('sale-date').value || todayStr();
      const price = document.getElementById('sale-price').value;
      const { autoItems, ambiguous } = resolveSaleCategories(numbersStr);
      if(ambiguous.length === 0){
        finalizeSale(date, price, autoItems);
      } else {
        saleResolution = { date, price, autoItems, ambiguous };
        renderPachete();
      }
    }
  };

  const confirmResolveBtn = document.getElementById('confirm-resolve');
  if(confirmResolveBtn){
    confirmResolveBtn.onclick = () => {
      const { date, price, autoItems, ambiguous } = saleResolution;
      const itemsByCategory = {};
      Object.keys(autoItems).forEach(cat => { itemsByCategory[cat] = [...autoItems[cat]]; });
      ambiguous.forEach((a, idx) => {
        const sel = document.getElementById(`resolve-cat-${idx}`);
        const cat = sel ? sel.value : a.options[0];
        if(a.notFound){
          const assignSel = document.getElementById(`resolve-assign-batch-${idx}`);
          const chosenBatchId = assignSel ? assignSel.value : '';
          if(chosenBatchId){
            addEntriesArray(chosenBatchId, cat, [a.number], 'added'); // now correctly counts against that batch's cost/profit
          }
        }
        itemsByCategory[cat] = itemsByCategory[cat] || [];
        itemsByCategory[cat].push(a.number);
      });
      saleResolution = null;
      finalizeSale(date, price, itemsByCategory);
    };
  }
  const cancelResolveBtn = document.getElementById('cancel-resolve');
  if(cancelResolveBtn){
    cancelResolveBtn.onclick = () => { saleResolution = null; renderPachete(); };
  }

  document.querySelectorAll('.batch-head').forEach(h => {
    h.onclick = (e) => {
      if(e.target.closest('button')) return;
      const id = h.dataset.id;
      expandedBatch = expandedBatch === id ? null : id;
      renderPachete();
    };
  });
  document.querySelectorAll('.delete-batch').forEach(btn => {
    btn.onclick = (e) => { e.stopPropagation(); deleteBatch(btn.dataset.id); };
  });
  document.querySelectorAll('.edit-batch').forEach(btn => {
    btn.onclick = (e) => { e.stopPropagation(); editingBatchId = btn.dataset.id; renderPachete(); };
  });
  document.querySelectorAll('.cancel-batch-edit').forEach(btn => {
    btn.onclick = () => { editingBatchId = null; renderPachete(); };
  });
  document.querySelectorAll('.save-batch-edit').forEach(btn => {
    btn.onclick = () => {
      const name = document.getElementById('eb-name').value;
      const date = document.getElementById('eb-date').value;
      const price = document.getElementById('eb-price').value;
      editBatch(btn.dataset.id, name, date, price);
      editingBatchId = null;
      renderPachete();
    };
  });
  document.querySelectorAll('.delete-entry').forEach(btn => {
    btn.onclick = (e) => { e.stopPropagation(); deleteEntry(btn.dataset.id); };
  });
}

function showToast(msg, isError, undoIds){
  const area = document.getElementById('toast-area');
  if(!area) return;
  const undoBtn = (undoIds && undoIds.length) ? `<div style="margin-top:8px;"><button class="btn secondary small" id="undo-add-btn">↩️ Anulează adăugarea</button></div>` : '';
  area.innerHTML = `<div class="toast" style="${isError ? 'background:rgba(200,35,44,0.3); border-color:var(--red); color:#f0c2b9;' : ''}">${escapeHtml(msg).replace(/\n/g, '<br>')}${undoBtn}</div>`;
  const btn = document.getElementById('undo-add-btn');
  if(btn){
    btn.onclick = () => {
      state.entries = state.entries.filter(e => !undoIds.includes(e.id));
      saveData();
      activeTab = 'pachete';
      render();
      setTimeout(() => showToast('Adăugarea a fost anulată.'), 0);
    };
  }
}

// Fixed reference prices for the "current unsold collection value" estimate shown atop Colecție.
// Separate from the editable Calculator prices on purpose — this is a fixed valuation, not a quote tool.
const COLLECTION_VALUE_PRICES = { Baza: 1, Speciale: 5, Power: 5 };
// Rare nu are un preț unic: doar SOB/SOG, EDL și autografele au valoare; restul (ex. Just 25) nu se contorizează.
const RARE_VALUE_PRICES = { sobg: 30, edl: 5, autograf: 500, just25: 500 };
function rareValuePrice(item){
  if(item.g === 'Special One Black' || item.g === 'Special One Gold') return RARE_VALUE_PRICES.sobg;
  if(item.g === 'Ediție Limitată') return RARE_VALUE_PRICES.edl;
  if(item.g === 'Just 25') return RARE_VALUE_PRICES.just25;
  if(item.g.indexOf('Autograf') !== -1) return RARE_VALUE_PRICES.autograf;
  return 0;
}
function ownershipTally(){
  let unique = 0, dubluri = 0, tripluri = 0;
  CATEGORIES.forEach(cat => {
    CATALOG[cat].forEach(i => {
      const c = stockCount(cat, i.n);
      if(c > 0) unique++;
      if(c === 2) dubluri++;
      else if(c >= 3) tripluri++;
    });
  });
  return { unique, dubluri, tripluri };
}
function collectionValue(){
  const mk = (perNum) => {
    let total = 0;
    const line = (label, count, unitPrice) => { const subtotal = count * unitPrice; total += subtotal; return { label, count, unitPrice, subtotal }; };
    let bazaCount = 0, stemaCount = 0;
    CATALOG.Baza.forEach(i => { const c = perNum(stockCount('Baza', i.n)); if(i.isStema) stemaCount += c; else bazaCount += c; });
    let specialeCount = 0;
    CATALOG.Speciale.forEach(i => { specialeCount += perNum(stockCount('Speciale', i.n)); });
    let powerCount = 0;
    CATALOG.Power.forEach(i => { powerCount += perNum(stockCount('Power', i.n)); });
    let sobgCount = 0, edlCount = 0, autografCount = 0, just25Count = 0;
    CATALOG.Rare.forEach(i => {
      const c = perNum(stockCount('Rare', i.n));
      if(i.g === 'Special One Black' || i.g === 'Special One Gold') sobgCount += c;
      else if(i.g === 'Ediție Limitată') edlCount += c;
      else if(i.g === 'Just 25') just25Count += c;
      else if(i.g.indexOf('Autograf') !== -1) autografCount += c;
    });
    const byCategory = [
      line('Bază (fără steme)', bazaCount, COLLECTION_VALUE_PRICES.Baza),
      line('Steme de echipă', stemaCount, COLLECTION_VALUE_PRICES.Speciale),
      line('Speciale', specialeCount, COLLECTION_VALUE_PRICES.Speciale),
      line('Power', powerCount, COLLECTION_VALUE_PRICES.Power),
      line('Rare · Special One Black/Gold', sobgCount, RARE_VALUE_PRICES.sobg),
      line('Rare · Ediții Limitate', edlCount, RARE_VALUE_PRICES.edl),
      line('Rare · Just 25', just25Count, RARE_VALUE_PRICES.just25),
      line('Rare · Autografe', autografCount, RARE_VALUE_PRICES.autograf)
    ];
    return { total, byCategory };
  };
  return { dup: mk(c => Math.max(0, c - 1)), album: mk(c => c > 0 ? 1 : 0) };
}

function renderCategory(cat, containerId){
  const panel = document.getElementById(containerId || `panel-${cat}`);
  const nums = allNumbersForCategory(cat);
  const search = catSearch[cat];
  const filtered = search ? nums.filter(n => n.includes(search)) : nums;
  let owned=0, sold=0, distinctOwned=0;
  nums.forEach(n => {
    const cnt = stockCount(cat,n);
    owned += cnt;
    if(cnt > 0) distinctOwned++;
  });
  sold = state.entries.filter(e => e.category === cat && e.action === 'sold').length;

  panel.innerHTML = `
    <div class="card">
      <h2>${CAT_LABEL[cat]}</h2>
      <div class="stat-strip" style="margin-top:0;">
        <div class="stat"><b>${owned}</b> am (total)</div>
        <div class="stat"><b>${distinctOwned}</b> numere diferite</div>
        <div class="stat"><b>${sold}</b> vândute</div>
      </div>
      <div class="field" style="margin-top:12px;">
        <label>Caută număr</label>
        <input type="text" id="cat-search" placeholder="ex: 16" value="${escapeHtml(search)}">
      </div>
      ${filtered.length === 0 ? '<div class="empty-state">Niciun cartonaș aici încă. Adaugă din tab-ul Pachete.</div>' : `
      <div class="badge-grid">
        ${filtered.map(n => {
          const cnt = stockCount(cat,n);
          const cls = cnt > 0 ? 'owned' : 'sold';
          const listed = cnt > 0 && isVintedListed(cat,n);
          const title = cnt > 0 ? (cnt > 1 ? `ai ${cnt} exemplare${listed ? ' · listat pe Vinted (click pentru a debifa)' : ' · click pentru a marca listat pe Vinted'}` : `ai cartonașul${listed ? ' · listat pe Vinted (click pentru a debifa)' : ' · click pentru a marca listat pe Vinted'}`) : 'vândut';
          return `<div class="badge ${cls} ${listed ? 'vinted-listed' : ''}" data-num="${escapeHtml(n)}" title="#${escapeHtml(n)} — ${title}">${escapeHtml(n)}${cnt > 1 ? `<span class="count-badge">${cnt}</span>` : ''}${listed ? `<span class="vinted-badge">V</span>` : ''}</div>`;
        }).join('')}
      </div>`}
      <div class="legend">
        <span><span class="dot owned"></span> Am cartonașul</span>
        <span><span class="dot sold"></span> Vândut</span>
        <span><span class="dot vinted"></span> Listat pe Vinted (click pe cartonaș pentru a bifa/debifa)</span>
      </div>
      ${filtered.length > 0 ? `<div class="hint" style="margin-top:14px;">Listă (le deții acum): ${filtered.filter(n => stockCount(cat,n) > 0).length > 0 ? escapeHtml(filtered.filter(n => stockCount(cat,n) > 0).join(', ')) : '—'}</div>` : ''}
      ${(() => { const vl = filtered.filter(n => stockCount(cat,n) > 0 && isVintedListed(cat,n)); return vl.length > 0 ? `<div class="hint">Listate pe Vinted: ${escapeHtml(vl.join(', '))}</div>` : ''; })()}
      <div class="hint">Pentru a corecta o greșeală sau a marca o vânzare, folosește formularul din tab-ul Pachete.</div>
    </div>
  `;
  document.getElementById('cat-search').oninput = (e) => {
    catSearch[cat] = e.target.value;
    const cursorPos = e.target.selectionStart;
    renderCategory(cat, containerId);
    const inp = document.getElementById('cat-search');
    if(inp){ inp.focus(); inp.setSelectionRange(cursorPos, cursorPos); }
  };
  panel.querySelectorAll('.badge').forEach(bd => {
    bd.onclick = () => {
      const n = bd.dataset.num;
      if(stockCount(cat, n) > 0){
        toggleVintedListed(cat, n);
        renderCategory(cat, containerId);
      }
    };
  });
}

function renderDuplicates(containerId){
  const panel = document.getElementById(containerId || 'panel-dubluri');
  let rows = [];
  CATEGORIES.forEach(cat => {
    allNumbersForCategory(cat).forEach(n => {
      const cnt = stockCount(cat, n);
      if(cnt > 1) rows.push({ category: cat, number: n, count: cnt - 1 }); // doar surplusul, fara exemplarul din album
    });
  });
  rows.sort((a,b) => (parseInt(a.number)||0)-(parseInt(b.number)||0) || a.category.localeCompare(b.category));
  const listFor = cats => rows.filter(r => cats.includes(r.category)).map(r => r.number).join(', ') || '—';
  const flatLists = [
    ['Bază', listFor(['Baza'])],
    ['Speciale + Power', listFor(['Speciale','Power'])],
    ['Rare', listFor(['Rare'])]
  ];

  panel.innerHTML = `
    <div class="card">
      <h2>Dubluri &amp; tripluri</h2>
      <div class="stat-strip" style="margin-top:0;">
        <div class="stat"><b>${rows.length}</b> numere cu mai multe exemplare</div>
      </div>
      <div class="hint" style="margin-top:10px;">Apar automat aici — orice cartonaș din care ajungi să ai 2 sau mai multe exemplare, direct din achizițiile de la tab-ul Pachete. Nu trebuie adăugat manual.</div>
      ${rows.length === 0 ? '<div class="empty-state" style="margin-top:14px;">Nicio dublură momentan.</div>' : `
      <div class="badge-grid">
        ${rows.map(r => {
          const listed = isVintedListed(r.category, r.number);
          const title = `${CAT_LABEL[r.category]} — ${r.count} dublur${r.count === 1 ? 'ă' : 'i'} (în plus față de cea din album)${listed ? ' · listat pe Vinted (click pentru a debifa)' : ' · click pentru a marca listat pe Vinted'}`;
          return `<div class="badge owned ${listed ? 'vinted-listed' : ''}" data-cat="${r.category}" data-num="${escapeHtml(r.number)}" title="${title}">${escapeHtml(r.number)}<span class="count-badge">${r.count}</span>${listed ? `<span class="vinted-badge">V</span>` : ''}</div>`;
        }).join('')}
      </div>
      <div class="hint" style="margin-top:14px;">${flatLists.map(([label, list]) => `<b>${label}:</b> ${escapeHtml(list)}`).join('<br>')}</div>
      `}
    </div>
  `;
  panel.querySelectorAll('.badge').forEach(bd => {
    bd.onclick = () => {
      toggleVintedListed(bd.dataset.cat, bd.dataset.num);
      renderDuplicates(containerId);
    };
  });
}

function renderChecklist(cat, cid){
  const panel = document.getElementById(cid);
  const q = (catSearch[cat] || '').toLowerCase();
  const items = CATALOG[cat];
  const groups = [...new Set(items.map(i => i.g))];
  const valid = items.filter(i => !i.na);
  const have = valid.filter(i => stockCount(cat,i.n) > 0).length;
  panel.innerHTML = `
    <div class="card">
      <h2>${CAT_LABEL[cat]} · ${have}/${valid.length}</h2>
      <div class="hint">Atinge o căsuță ca s-o bifezi în album (fără cost). Cărțile din pachete se bifează singure. Verde = în album, portocaliu = ai dubluri.</div>
      <div class="field" style="margin-top:10px;"><input type="text" id="cat-search" placeholder="Caută număr sau jucător" value="${escapeHtml(catSearch[cat] || '')}"></div>
    </div>` + groups.map(g => {
      const gi = items.filter(i => i.g === g && (!q || (i.n + ' ' + i.name).toLowerCase().includes(q)));
      if(gi.length === 0) return '';
      const all = items.filter(i => i.g === g && !i.na);
      const h = all.filter(i => stockCount(cat,i.n) > 0).length;
      return `<div class="card" style="margin-top:12px;"><h3 class="ck-h">${escapeHtml(g)} · ${h}/${all.length}</h3><div class="ck-grid">${gi.map(i => {
        const c = i.na ? 0 : stockCount(cat,i.n);
        return `<div class="ck ${i.na ? 'na' : c > 1 ? 'dup' : c ? 'have' : ''}" data-n="${escapeHtml(i.n)}"><b>${escapeHtml(i.n)}${c > 1 ? ' ×' + c : ''}</b>${escapeHtml(i.na ? 'încă needitat' : i.name)}</div>`;
      }).join('')}</div></div>`;
    }).join('');
  const s = document.getElementById('cat-search');

  panel.querySelectorAll('.ck:not(.na)').forEach(el => el.onclick = () => {

// Revenue attributed to one batch: for every sale, split its price evenly across all units sold in that
// transaction, then sum the shares belonging to units that came from this batch.
function batchRevenue(batchId){
  let total = 0;
  state.sales.forEach(s => {
    if(s.price == null || !s.units || s.units.length === 0) return;
    const unitsInBatch = s.units.filter(u => u.batchId === batchId).length;
    if(unitsInBatch === 0) return;
    total += (s.price / s.units.length) * unitsInBatch;
  });
  return total;
}
// Which of this batch's cards are still unsold right now (FIFO-aware: if the same number also
// came from another batch, only counts the units that are actually still-in-stock from THIS batch),
// plus their estimated resale value at the fixed Colecție prices.
// Prețul folosit la "cost neamortizat": la fel ca la Valoare colecție — stemă = preț de Speciale, Rare pe sub-serii.
function valuePriceForItem(cat, number){
  if(cat === 'Rare'){
    const item = CATALOG.Rare.find(i => i.n === number);
    return item ? rareValuePrice(item) : 0;
  }
  if(cat === 'Baza'){
    const item = CATALOG.Baza.find(i => i.n === number);
    return (item && item.isStema) ? COLLECTION_VALUE_PRICES.Speciale : COLLECTION_VALUE_PRICES.Baza;
  }
  return COLLECTION_VALUE_PRICES[cat] || 0;
}
function batchRemainingValue(batchId){
  const byCategory = {};
  let total = 0;
  state.entries.filter(e => e.batchId === batchId && e.action === 'added').forEach(addEntry => {
    const remainingStock = stockFor(addEntry.category, addEntry.number); // FIFO, cel mai vechi rămas = exemplarul de album, nu se contorizează ca dublură
    const posInStock = remainingStock.findIndex(u => u.id === addEntry.id);
    const isUnsoldDuplicate = posInStock > 0; // in stoc (posInStock !== -1) si nu e cel mai vechi (indexul 0)
    if(isUnsoldDuplicate){
      byCategory[addEntry.category] = byCategory[addEntry.category] || [];
      byCategory[addEntry.category].push(addEntry.number);
      total += valuePriceForItem(addEntry.category, addEntry.number);
    }
  });
  return { byCategory, total };
}

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

      if(error) renderLogin('signup', error.message);
      else renderLogin('login', null, 'Cont creat — dacă ți se cere, confirmă emailul primit, apoi intră în cont.');
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if(error) renderLogin('login', error.message);
      else await bootAfterLogin();
    }
  };
}

// Citeste un tabel intreg, paginand — Supabase opreste implicit orice citire la 1000 de randuri.
async function selectAll(table){
  const pageSize = 1000;
  let all = [], from = 0;
  while(true){
    const { data, error } = await sb.from(table).select('*').range(from, from + pageSize - 1);
    if(error) throw error;
    all = all.concat(data || []);
    if(!data || data.length < pageSize) break;
    from += pageSize;
  }
  return all;
}
// Trage datele din Supabase (tabelele tale) in starea locala a aplicatiei.
async function pullFromSupabase(){
  const [batches, entries, sales, vinted] = await Promise.all([
    selectAll('batches'),
    selectAll('entries'),
    selectAll('sales'),
    selectAll('vinted_listed')
  ]);
  state.batches = (batches || []).map(b => ({ id: b.id, name: b.name, date: b.date, price: Number(b.price) || 0 }));
  state.entries = (entries || []).map(e => ({ id: e.id, batchId: e.batch_id, category: e.category, number: e.number, action: e.action, saleId: e.sale_id || null, ts: Number(e.ts) }));
  state.sales = (sales || []).map(s => ({ id: s.id, date: s.date, price: Number(s.price) || 0, units: s.units || [] }));
  state.vintedListed = (vinted || []).map(v => ({ category: v.category, number: v.number }));
}

// Trimite starea curenta in Supabase — inlocuieste tot ce are userul acolo cu ce are acum local.
async function pushToSupabase(){
  if(!currentUserId) return;
  await sb.from('entries').delete().eq('user_id', currentUserId);
  await sb.from('batches').delete().eq('user_id', currentUserId);
  await sb.from('sales').delete().eq('user_id', currentUserId);
  await sb.from('vinted_listed').delete().eq('user_id', currentUserId);
  if(state.batches.length){
    const { error } = await sb.from('batches').insert(state.batches.map(b => ({ id: b.id, name: b.name, date: b.date, price: b.price, user_id: currentUserId })));
    if(error) throw error;
  }
  if(state.entries.length){
    const { error } = await sb.from('entries').insert(state.entries.map(e => ({ id: e.id, batch_id: e.batchId, category: e.category, number: e.number, action: e.action, sale_id: e.saleId || null, ts: e.ts, user_id: currentUserId })));
    if(error) throw error;
  }
  if(state.sales.length){
    const { error } = await sb.from('sales').insert(state.sales.map(s => ({ id: s.id, date: s.date, price: s.price, units: s.units, user_id: currentUserId })));
    if(error) throw error;
  }
  if(state.vintedListed.length){
    const { error } = await sb.from('vinted_listed').insert(state.vintedListed.map(v => ({ category: v.category, number: v.number, user_id: currentUserId })));
    if(error) throw error;
  }
}

async function bootAfterLogin(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ renderLogin('login'); return; }
  currentUserId = session.user.id;
  const app = document.getElementById('app');
  app.innerHTML = `<div class="loading">Se încarcă albumul din Supabase…</div>`;
  let pullError = null;
  try{
    await pullFromSupabase();
    // doar o copie locala de rezerva — NU trimitem inapoi la Supabase, tocmai am luat de-acolo, nu are rost
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e0){}
  }catch(e){
    console.error('Nu am putut trage datele din Supabase, folosim ultima copie locala.', e);
    pullError = (e && e.message) ? e.message : String(e);
    try{ const raw = localStorage.getItem(STORAGE_KEY); if(raw) state = Object.assign(state, JSON.parse(raw)); }catch(e2){}
  }
  render();
  if(pullError){
    const area = document.getElementById('toast-area') || document.querySelector('.app');
    if(area){
      const div = document.createElement('div');
      div.className = 'toast toast-warn';
      div.style.margin = '10px 16px';
      div.innerHTML = '⚠️ Nu am putut trage datele din Supabase, arăt o copie locală mai veche (poate incompletă). Eroare: ' + escapeHtml(pullError) + '. Deschide consola browserului (F12) pentru detalii și trimite-mi exact acest text.';
      area.parentElement ? area.parentElement.insertBefore(div, area) : document.body.insertBefore(div, document.body.firstChild);
    }
  }
}

(async function startApp(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){ await bootAfterLogin(); }
  else { renderLogin('login'); }
})();
